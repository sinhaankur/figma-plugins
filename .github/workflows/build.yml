name: Build plugins

# Auto-build every plugin that has a build step on each push, and commit the fresh
# dist/ back — so the codebase always has an up-to-date compiled bundle. (You still
# click Publish in Figma; that step can't be automated.)

on:
  push:
    branches: [main]
    paths:
      - "*/src/**"
      - "*/build.mjs"
      - "*/package.json"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build every plugin that has build.mjs
        run: |
          set -e
          for dir in */ ; do
            if [ -f "${dir}build.mjs" ] && [ -f "${dir}package.json" ]; then
              echo "── building ${dir}"
              ( cd "$dir" && npm install --no-audit --no-fund && node build.mjs )
            fi
          done

      - name: Run tests where present
        run: |
          for dir in */ ; do
            if [ -f "${dir}package.json" ] && grep -q '"test"' "${dir}package.json"; then
              echo "── testing ${dir}"
              ( cd "$dir" && npm test ) || exit 1
            fi
          done

      - name: Commit fresh dist/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*/dist" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No dist changes to commit."
          else
            git commit -m "ci: rebuild plugin dist [skip ci]"
            git push
          fi
