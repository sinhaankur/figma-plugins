<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: var(--figma-color-bg, #fff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --text: var(--figma-color-text, #1e1e1e);
    --text2: var(--figma-color-text-secondary, #999);
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --on-brand: var(--figma-color-text-onbrand, #fff);
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px; color: var(--text); background: var(--bg);
  }
  #root { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 11px; color: var(--text2); }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; padding: 6px 8px; font-size: 11px; cursor: pointer;
    background: var(--bg2); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
  }
  .seg button.active { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  textarea, input[type="text"], input[type="number"] {
    width: 100%; box-sizing: border-box;
    font-size: 12px; color: var(--text);
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 5px; padding: 8px;
  }
  textarea {
    min-height: 150px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    resize: vertical;
  }
  textarea:focus, input:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .hidden { display: none; }
  .status { font-size: 11px; color: var(--text2); min-height: 14px; }
  #render-frame { position: absolute; left: -9999px; top: -9999px; width: 1280px; border: none; visibility: hidden; }
  .footer { position: sticky; bottom: 0; background: var(--bg); padding-top: 4px; }
  #convert {
    width: 100%; padding: 9px; font-size: 12px; font-weight: 600; cursor: pointer;
    background: var(--brand); color: var(--on-brand); border: none; border-radius: 6px;
  }
  #convert:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div id="root">
  <div class="field">
    <label>Import from</label>
    <div class="seg" id="mode">
      <button type="button" data-mode="paste" class="active">Paste HTML</button>
      <button type="button" data-mode="url">From URL</button>
    </div>
  </div>

  <div class="field" id="panel-paste">
    <label>HTML code</label>
    <textarea id="html-input" placeholder="Paste HTML here — e.g. a Claude artifact, a page's source, or any HTML snippet…"></textarea>
  </div>

  <div class="field hidden" id="panel-url">
    <label>Page URL</label>
    <input type="text" id="url-input" placeholder="https://example.com" />
  </div>

  <div class="field">
    <label>Viewport width (px)</label>
    <input type="number" id="vp-width" value="1280" min="320" max="3840" />
  </div>

  <div id="status" class="status"></div>

  <div class="footer">
    <button id="convert" type="button">Convert to Figma</button>
  </div>
</div>

<iframe id="render-frame"></iframe>

<script>
  var statusEl = document.getElementById("status");
  function setStatus(m) { statusEl.textContent = m || ""; }

  // auto-resize the plugin window to fit content
  function reportHeight() {
    var h = Math.ceil(document.getElementById("root").getBoundingClientRect().height);
    parent.postMessage({ pluginMessage: { type: "resize", height: h } }, "*");
  }
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(reportHeight).observe(document.getElementById("root"));

  // mode toggle (plain buttons, no deprecated fig-* components)
  var currentMode = "paste";
  var modeEl = document.getElementById("mode");
  modeEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    currentMode = btn.getAttribute("data-mode");
    var buttons = modeEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove("active");
    btn.classList.add("active");
    var isUrl = currentMode === "url";
    document.getElementById("panel-paste").classList.toggle("hidden", isUrl);
    document.getElementById("panel-url").classList.toggle("hidden", !isUrl);
  });

  // parse a rendered DOM element into a plain tree
  function parseTree(el) {
    var win = el.ownerDocument.defaultView;
    if (el.nodeType === 3) {
      var text = el.textContent.trim(); if (!text) return null;
      var range = el.ownerDocument.createRange(); range.selectNodeContents(el);
      var tr = range.getBoundingClientRect();
      var pcs = el.parentElement ? win.getComputedStyle(el.parentElement) : {};
      return { tag: "#text", text: text, styles: {
        fontSize: pcs.fontSize || "14px", color: pcs.color || "rgb(0,0,0)",
        fontWeight: pcs.fontWeight || "400", textAlign: pcs.textAlign || "left"
      }, children: [], width: tr.width, height: tr.height, x: tr.left, y: tr.top };
    }
    var rect = el.getBoundingClientRect();
    var cs = win.getComputedStyle(el);
    var node = { tag: el.tagName.toLowerCase(), styles: {}, children: [],
      width: rect.width, height: rect.height, x: rect.left, y: rect.top };
    var props = ["backgroundColor","color","fontSize","fontWeight","textAlign","borderRadius","borderWidth","borderColor","opacity","display","visibility","boxShadow"];
    for (var i = 0; i < props.length; i++) { try { node.styles[props[i]] = cs[props[i]] || ""; } catch (e) {} }
    if (node.tag === "img") node.src = el.currentSrc || el.src;
    for (var k = 0; k < el.childNodes.length; k++) {
      var ch = el.childNodes[k];
      if (ch.nodeType === 1) {
        var tag = ch.tagName.toLowerCase();
        if (["script","style","meta","link","noscript"].indexOf(tag) > -1) continue;
        var p = parseTree(ch); if (p) node.children.push(p);
      } else if (ch.nodeType === 3 && ch.textContent.trim()) {
        var pt = parseTree(ch); if (pt) node.children.push(pt);
      }
    }
    return node;
  }

  async function fetchBytes(url) {
    try { var r = await fetch(url); var b = await r.arrayBuffer(); return Array.prototype.slice.call(new Uint8Array(b)); }
    catch (e) { return null; }
  }
  async function processImages(node) {
    if (!node) return;
    if (node.tag === "img" && node.src) node.imageBytes = await fetchBytes(node.src);
    if (node.children) for (var i = 0; i < node.children.length; i++) await processImages(node.children[i]);
  }

  function renderHtml(html, width) {
    var iframe = document.getElementById("render-frame");
    iframe.style.width = width + "px";
    return new Promise(function (resolve, reject) {
      iframe.onload = async function () {
        try {
          var doc = iframe.contentDocument, body = doc.body;
          if (!body || !body.children.length) { reject(new Error("No content to convert")); return; }
          setStatus("Parsing layout…");
          var tree = parseTree(body);
          setStatus("Processing images…"); await processImages(tree);
          setStatus(""); resolve(tree);
        } catch (e) { reject(e); }
      };
      var doc = iframe.contentDocument;
      doc.open();
      doc.write('<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}</style></head><body>' + html + "</body></html>");
      doc.close();
    });
  }

  document.getElementById("convert").addEventListener("click", async function () {
    var btn = this; btn.setAttribute("disabled", "");
    try {
      var width = Number(document.getElementById("vp-width").value) || 1280;
      var html;
      if (currentMode === "url") {
        var url = document.getElementById("url-input").value.trim();
        if (!url) { setStatus("Enter a URL."); btn.removeAttribute("disabled"); return; }
        setStatus("Fetching page…");
        var res = await fetch(url); if (!res.ok) throw new Error("Fetch failed: " + res.status);
        html = await res.text();
      } else {
        html = document.getElementById("html-input").value.trim();
        if (!html) { setStatus("Paste some HTML first."); btn.removeAttribute("disabled"); return; }
      }
      var tree = await renderHtml(html, width);
      setStatus("Converting…");
      parent.postMessage({ pluginMessage: { type: "convert", tree: tree } }, "*");
      setTimeout(function () { setStatus(""); }, 2000);
    } catch (e) { setStatus("Error: " + e.message); }
    finally { btn.removeAttribute("disabled"); }
  });
</script>
</body>
</html>
