<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><style>
/* sinhaankur.com design language: warm-dark paper, serif display, aurora accent */
:root{
  --bg:#0b0c10;--bg2:#111218;--card:#15161d;--card2:#1b1d26;--fg:#f4f4f5;--fg2:#e6e6ea;
  --muted:#8b8f9a;--accent:#f43f5e;--accent2:#fb7185;--line:rgba(255,255,255,.07);
  --ok:#34d399;--warn:#fbbf24;--info:#60a5fa;
  --sans:'Inter',-apple-system,system-ui,'Segoe UI',sans-serif;
  --serif:'Fraunces','Georgia','Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--fg);font-size:13px;-webkit-font-smoothing:antialiased}
/* soft aurora glow behind the header */
body::before{content:"";position:fixed;top:-120px;left:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(244,63,94,.22),transparent 68%);filter:blur(50px);pointer-events:none;z-index:0}
.wrap{padding:18px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;font-family:var(--serif);font-weight:800;color:#fff;font-size:17px;box-shadow:0 3px 12px rgba(244,63,94,.4)}
.brand h1{font-family:var(--serif);font-size:19px;margin:0;font-weight:600;letter-spacing:-.01em}
.brand .by{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
.eyebrow{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;margin:0 0 3px}
.htitle{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.015em}
.htitle em{font-style:italic;color:var(--accent)}
.lead{color:var(--muted);font-size:12.5px;line-height:1.55;margin:0 0 16px}
.back{background:transparent;border:0;color:var(--muted);cursor:pointer;font-family:inherit;font-size:12px;padding:0;margin-bottom:12px;transition:.12s}
.back:hover{color:var(--fg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;transition:transform .14s cubic-bezier(.16,1,.3,1),border-color .14s,background .14s;text-align:left}
.tile:hover{border-color:rgba(244,63,94,.5);background:var(--card2);transform:translateY(-2px)}
.tile .ic{font-size:22px;filter:saturate(1.1)}
.tile .n{font-weight:600;margin-top:9px;font-size:13.5px;letter-spacing:-.01em}
.tile .d{color:var(--muted);font-size:11px;margin-top:3px;line-height:1.45}
label{font-family:var(--mono);font-size:10px;color:var(--muted);display:block;margin:12px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
input[type=text],textarea,select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:11px;font-family:inherit;font-size:12.5px;transition:border-color .12s}
input:focus,textarea:focus{outline:0;border-color:var(--accent)}
input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:9px;background:none;padding:3px;cursor:pointer}
textarea{font-family:var(--mono);font-size:11px;height:180px;resize:vertical;line-height:1.5}
.crow{display:flex;align-items:center;gap:10px;margin-bottom:9px}.crow label{margin:0;flex:1}
.go{width:100%;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;margin-top:14px;box-shadow:0 4px 16px rgba(244,63,94,.28);transition:.14s;letter-spacing:.01em}
.go:hover{filter:brightness(1.08);transform:translateY(-1px)} .go:active{transform:translateY(0)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:10px;cursor:pointer;font-family:inherit;font-size:12px;transition:.12s}
.ghost:hover{border-color:rgba(255,255,255,.25);color:var(--fg)}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:10px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:7px;font-weight:600;cursor:pointer;font-family:inherit;font-size:12px;transition:.12s}
.tabs button.on{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff}
.status{color:var(--muted);font-size:11px;min-height:15px;margin-top:10px;text-align:center}
.summary{display:flex;gap:9px;margin:12px 0}.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;font-family:var(--serif);font-weight:600}.stat.e b{color:var(--accent)}.stat.w b{color:var(--warn)}.stat.i b{color:var(--info)}.stat span{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.item{display:flex;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:.1s}.item:hover{background:var(--card)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex:0 0 auto}.dot.error{background:var(--accent)}.dot.warn{background:var(--warn)}.dot.info{background:var(--info)}
.item .n{font-weight:600;font-size:12px}.item .m{color:var(--muted);font-size:11px;line-height:1.4}
.list{max-height:240px;overflow:auto;margin-top:4px}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.hidden{display:none}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:11px;color:var(--muted);cursor:pointer;transition:.12s}.pill:hover{border-color:rgba(255,255,255,.2)}.pill.on{border-color:var(--accent);color:var(--fg);background:rgba(244,63,94,.1)}
iframe#stage{position:fixed;left:-99999px;top:0;width:1056px;height:2000px;border:0;opacity:0}
</style></head><body>
<div class="wrap">
  <div class="brand"><div class="mark">S</div><h1>sinhaankur Kit</h1><span class="by">all-in-one</span></div>

  <!-- HOME -->
  <div id="home">
    <p class="eyebrow">design toolkit · on-device</p>
    <h2 class="htitle">Everything you need, <em>in one place</em>.</h2>
    <p class="lead">Create kits, audit, sync tokens, fill content, turn HTML into layers, and hand off to code — pick a tool.</p>
    <div class="grid">
      <button class="tile" data-go="kit"><div class="ic">🧩</div><div class="n">Create UX kit</div><div class="d">Buttons, inputs, cards… from your colors & font</div></button>
      <button class="tile" data-go="audit"><div class="ic">🔍</div><div class="n">Audit</div><div class="d">Contrast, hardcoded colors, spacing, tap targets</div></button>
      <button class="tile" data-go="library"><div class="ic">📚</div><div class="n">Library manager</div><div class="d">Naming, duplicates, structure, health</div></button>
      <button class="tile" data-go="tokens"><div class="ic">🎨</div><div class="n">Tokens sync</div><div class="d">Styles ⇄ JSON + CSS variables</div></button>
      <button class="tile" data-go="content"><div class="ic">✍️</div><div class="n">Content filler</div><div class="d">Realistic names, prices, dates…</div></button>
      <button class="tile" data-go="html"><div class="ic">🌐</div><div class="n">HTML → layers</div><div class="d">A URL or HTML into editable layers</div></button>
      <button class="tile" data-go="dev"><div class="ic">💻</div><div class="n">Dev / VS Code</div><div class="d">Export tokens + component manifest for your repo</div></button>
    </div>
  </div>

  <!-- KIT -->
  <div id="kit" class="hidden">
    <button class="back" data-home>‹ Home</button><label>Create a UX kit</label>
    <div class="crow"><label>Accent</label><input type="color" id="kAccent" value="#f43f5e"></div>
    <div class="crow"><label>Text</label><input type="color" id="kFg" value="#0e0f13"></div>
    <div class="crow"><label>Background</label><input type="color" id="kBg" value="#ffffff"></div>
    <div class="crow"><label>Muted / border</label><input type="color" id="kMuted" value="#9aa0aa"></div>
    <label>Font family</label><input type="text" id="kFont" value="Inter">
    <label>Corner radius</label><input type="text" id="kRadius" value="10">
    <button class="go" id="kGo">Generate kit + styles</button><div class="status" id="kStatus"></div>
  </div>

  <!-- AUDIT -->
  <div id="audit" class="hidden">
    <button class="back" data-home>‹ Home</button>
    <div class="tabs"><button id="aPage" class="on">Whole page</button><button id="aSel">Selection</button></div>
    <button class="go" id="aGo">Run audit</button><div id="aOut"></div>
  </div>

  <!-- LIBRARY -->
  <div id="library" class="hidden">
    <button class="back" data-home>‹ Home</button><label>Component library</label>
    <button class="go" id="lGo">Scan components</button><div id="lOut"></div>
  </div>

  <!-- TOKENS -->
  <div id="tokens" class="hidden">
    <button class="back" data-home>‹ Home</button>
    <div class="tabs"><button id="tExport" class="on">Export</button><button id="tImport">Import</button></div>
    <div id="tExportPane"><div class="crow"><label>CSS prefix</label><input type="text" id="tPrefix" placeholder="kelo (optional)"></div>
      <button class="go" id="tGo">Read styles</button>
      <div class="tabs" style="margin-top:8px"><button id="fJson" class="on">JSON</button><button id="fCss">CSS</button></div>
      <textarea id="tOut" readonly></textarea><button class="ghost" id="tCopy" style="width:100%;margin-top:6px">Copy</button></div>
    <div id="tImportPane" class="hidden"><label>Paste tokens JSON</label><textarea id="tIn"></textarea><button class="go" id="tImportGo">Apply to styles</button></div>
    <div class="status" id="tStatus"></div>
  </div>

  <!-- CONTENT -->
  <div id="content" class="hidden">
    <button class="back" data-home>‹ Home</button><label>Fill selected text</label>
    <div class="pills" id="cPills">
      <span class="pill on" data-m="auto">Auto</span><span class="pill" data-m="fullName">Name</span><span class="pill" data-m="email">Email</span><span class="pill" data-m="price">Price</span><span class="pill" data-m="date">Date</span><span class="pill" data-m="city">City</span><span class="pill" data-m="company">Company</span><span class="pill" data-m="rating">Rating</span><span class="pill" data-m="paragraph">Paragraph</span>
    </div>
    <button class="go" id="cGo">Fill</button><button class="ghost" id="cShuffle" style="width:100%;margin-top:6px">Reshuffle</button><div class="status" id="cStatus"></div>
  </div>

  <!-- HTML -->
  <div id="html" class="hidden">
    <button class="back" data-home>‹ Home</button>
    <div class="tabs"><button id="hHtml" class="on">Paste HTML</button><button id="hUrl">From URL</button></div>
    <div id="hHtmlPane"><label>HTML</label><textarea id="hHtmlIn" placeholder="Paste page HTML…"></textarea></div>
    <div id="hUrlPane" class="hidden"><label>URL</label><input type="text" id="hUrlIn" placeholder="https://sinhaankur.com"></div>
    <div class="crow"><label>Width</label><input type="text" id="hWidth" value="1056"></div>
    <button class="go" id="hGo">Import</button><div class="status" id="hStatus"></div>
  </div>

  <!-- DEV -->
  <div id="dev" class="hidden">
    <button class="back" data-home>‹ Home</button><label>Dev bundle (for VS Code / your repo)</label>
    <div class="crow"><label>CSS prefix</label><input type="text" id="dPrefix" placeholder="kelo (optional)"></div>
    <button class="go" id="dGo">Build dev bundle</button>
    <label style="margin-top:10px">Result</label><textarea id="dOut" readonly placeholder="tokens.css + tokens.json + components manifest…"></textarea>
    <div class="crow" style="margin-top:6px"><button class="ghost" id="dCopy" style="flex:1">Copy</button><button class="ghost" id="dDownload" style="flex:1">Download bundle</button></div>
    <div class="status" id="dStatus"></div>
  </div>
</div>
<iframe id="stage" sandbox="allow-same-origin"></iframe>
<script src="ui.js"></script>
</body></html>
