<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><style>
/* Figma-native: all colour from Figma theme vars (auto light/dark), 11px Inter. */
:root{
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --radius:6px;
  --figma-color-bg:#fff;--figma-color-bg-secondary:#f5f5f5;--figma-color-bg-hover:rgba(0,0,0,.06);
  --figma-color-bg-brand:#0d99ff;--figma-color-bg-brand-hover:#0b87e0;--figma-color-bg-disabled:rgba(0,0,0,.06);
  --figma-color-text:#1e1e1e;--figma-color-text-secondary:#666;--figma-color-text-onbrand:#fff;
  --figma-color-border:rgba(0,0,0,.1);--figma-color-border-brand:#0d99ff;
  --figma-color-text-success:#14ae5c;--figma-color-text-warning:#a05a00;--figma-color-text-danger:#c00;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--figma-color-bg);color:var(--figma-color-text);font-size:11px;line-height:16px;-webkit-font-smoothing:antialiased}
.wrap{padding:16px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--figma-color-border)}
.mark{width:20px;height:20px;color:var(--figma-color-bg-brand);display:grid;place-items:center}
.brand h1{font-size:11px;margin:0;font-weight:600}
.brand .by{margin-left:auto;font-size:10px;color:var(--figma-color-text-secondary)}
.eyebrow{font-family:var(--mono);font-size:10px;color:var(--figma-color-text-secondary);letter-spacing:.12em;text-transform:uppercase;margin:0 0 3px}
.htitle{font-size:14px;font-weight:600;margin:0 0 4px}
.htitle em{font-style:normal;color:var(--figma-color-bg-brand)}
.lead{color:var(--figma-color-text-secondary);font-size:11px;line-height:1.5;margin:0 0 14px}
.back{background:transparent;border:0;color:var(--figma-color-text-secondary);cursor:pointer;font-family:inherit;font-size:11px;padding:0;margin-bottom:12px}
.back:hover{color:var(--figma-color-text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--figma-color-bg);border:1px solid var(--figma-color-border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:background .1s,border-color .1s;text-align:left}
.tile:hover{border-color:var(--figma-color-border-brand);background:var(--figma-color-bg-hover)}
.tile .ic{font-size:18px}
.tile .n{font-weight:600;margin-top:8px;font-size:12px}
.tile .d{color:var(--figma-color-text-secondary);font-size:10px;margin-top:2px;line-height:1.4}
label{font-size:11px;color:var(--figma-color-text);display:block;margin:12px 0 6px;font-weight:600}
input[type=text],textarea,select{width:100%;background:var(--figma-color-bg);border:1px solid var(--figma-color-border);border-radius:var(--radius);color:var(--figma-color-text);padding:7px 8px;font-family:inherit;font-size:11px;line-height:16px}
input[type=text]:hover,textarea:hover{border-color:var(--figma-color-text-secondary)}
input:focus,textarea:focus{outline:0;border-color:var(--figma-color-border-brand);box-shadow:0 0 0 1px var(--figma-color-border-brand) inset}
input[type=color]{width:36px;height:28px;border:1px solid var(--figma-color-border);border-radius:var(--radius);background:none;padding:2px;cursor:pointer}
textarea{font-family:var(--mono);font-size:10px;height:170px;resize:vertical;line-height:1.5}
.crow{display:flex;align-items:center;gap:10px;margin-bottom:8px}.crow label{margin:0;flex:1}
.go{width:100%;border:0;border-radius:var(--radius);height:32px;background:var(--figma-color-bg-brand);color:var(--figma-color-text-onbrand);font-weight:600;cursor:pointer;font-family:inherit;font-size:11px;margin-top:12px}
.go:hover{background:var(--figma-color-bg-brand-hover)}
.ghost{background:var(--figma-color-bg);border:1px solid var(--figma-color-border);color:var(--figma-color-text);border-radius:var(--radius);padding:7px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600}
.ghost:hover{background:var(--figma-color-bg-hover)}
.tabs{display:flex;gap:2px;background:var(--figma-color-bg-secondary);border-radius:var(--radius);padding:2px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--figma-color-text-secondary);padding:5px;border-radius:4px;font-weight:500;cursor:pointer;font-family:inherit;font-size:11px}
.tabs button:hover{color:var(--figma-color-text)}
.tabs button.on{background:var(--figma-color-bg);color:var(--figma-color-text);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.status{color:var(--figma-color-text-secondary);font-size:11px;min-height:15px;margin-top:10px;text-align:center}
.status.ok{color:var(--figma-color-text-success)}
.summary{display:flex;gap:8px;margin:12px 0}.stat{flex:1;background:var(--figma-color-bg-secondary);border-radius:var(--radius);padding:8px;text-align:center}.stat b{display:block;font-size:16px;font-weight:700}.stat.e b{color:var(--figma-color-text-danger)}.stat.w b{color:var(--figma-color-text-warning)}.stat.i b{color:var(--figma-color-bg-brand)}.stat span{color:var(--figma-color-text-secondary);font-size:9px;text-transform:uppercase;letter-spacing:.06em}
.item{display:flex;gap:8px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--figma-color-border);margin-bottom:6px}.item:hover{background:var(--figma-color-bg-hover)}
.dot{width:7px;height:7px;border-radius:50%;margin-top:4px;flex:0 0 auto}.dot.error{background:var(--figma-color-text-danger)}.dot.warn{background:var(--figma-color-text-warning)}.dot.info{background:var(--figma-color-text-secondary)}
.item .n{font-weight:600;font-size:11px}.item .m{color:var(--figma-color-text-secondary);font-size:11px;line-height:1.4}
.list{max-height:280px;overflow:auto;margin-top:4px}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:var(--figma-color-border);border-radius:3px}
.hidden{display:none}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pill{background:var(--figma-color-bg-secondary);border:1px solid transparent;border-radius:20px;padding:5px 10px;font-size:11px;color:var(--figma-color-text-secondary);cursor:pointer}.pill:hover{color:var(--figma-color-text)}.pill.on{border-color:var(--figma-color-border-brand);color:var(--figma-color-text);background:var(--figma-color-bg)}
iframe#stage{position:fixed;left:-99999px;top:0;width:1056px;height:2000px;border:0;opacity:0}
</style></head><body>
<div class="wrap">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="2"/>
      <path d="M8 15c0-2 3-2 4-3s0-3-2-3M12 8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>sinhaankur Kit</h1><span class="by">design toolkit</span>
  </div>

  <!-- HOME -->
  <div id="home">
    <p class="eyebrow">design toolkit · on-device</p>
    <h2 class="htitle">Everything you need, <em>in one place</em>.</h2>
    <p class="lead">Create kits, audit, sync tokens, fill content, turn HTML into layers, and hand off to code — pick a tool.</p>
    <div class="grid">
      <button class="tile" data-go="kit"><div class="ic">🧩</div><div class="n">Create UX kit</div><div class="d">Buttons, inputs, cards… from your colors & font</div></button>
      <button class="tile" data-go="audit"><div class="ic">🔍</div><div class="n">Audit</div><div class="d">Contrast, hardcoded colors, spacing, tap targets</div></button>
      <button class="tile" data-go="library"><div class="ic">📚</div><div class="n">Library manager</div><div class="d">Naming, duplicates, structure, health</div></button>
      <button class="tile" data-go="tokens"><div class="ic">🎨</div><div class="n">Tokens sync</div><div class="d">Styles ⇄ JSON + CSS variables</div></button>
      <button class="tile" data-go="content"><div class="ic">✍️</div><div class="n">Content filler</div><div class="d">Realistic names, prices, dates…</div></button>
      <button class="tile" data-go="html"><div class="ic">🌐</div><div class="n">HTML → layers</div><div class="d">A URL or HTML into editable layers</div></button>
      <button class="tile" data-go="dev"><div class="ic">💻</div><div class="n">Dev / VS Code</div><div class="d">Export tokens + component manifest for your repo</div></button>
    </div>
  </div>

  <!-- KIT -->
  <div id="kit" class="hidden">
    <button class="back" data-home>‹ Home</button><label>Create a UX kit</label>
    <div class="crow"><label>Accent</label><input type="color" id="kAccent" value="#f43f5e"></div>
    <div class="crow"><label>Text</label><input type="color" id="kFg" value="#0e0f13"></div>
    <div class="crow"><label>Background</label><input type="color" id="kBg" value="#ffffff"></div>
    <div class="crow"><label>Muted / border</label><input type="color" id="kMuted" value="#9aa0aa"></div>
    <label>Font family</label><input type="text" id="kFont" value="Inter">
    <label>Corner radius</label><input type="text" id="kRadius" value="10">
    <button class="go" id="kGo">Generate kit + styles</button><div class="status" id="kStatus"></div>
  </div>

  <!-- AUDIT -->
  <div id="audit" class="hidden">
    <button class="back" data-home>‹ Home</button>
    <div class="tabs"><button id="aPage" class="on">Whole page</button><button id="aSel">Selection</button></div>
    <button class="go" id="aGo">Run audit</button><div id="aOut"></div>
  </div>

  <!-- LIBRARY -->
  <div id="library" class="hidden">
    <button class="back" data-home>‹ Home</button><label>Component library</label>
    <button class="go" id="lGo">Scan components</button><div id="lOut"></div>
  </div>

  <!-- TOKENS -->
  <div id="tokens" class="hidden">
    <button class="back" data-home>‹ Home</button>
    <div class="tabs"><button id="tExport" class="on">Export</button><button id="tImport">Import</button></div>
    <div id="tExportPane"><div class="crow"><label>CSS prefix</label><input type="text" id="tPrefix" placeholder="kelo (optional)"></div>
      <button class="go" id="tGo">Read styles</button>
      <div class="tabs" style="margin-top:8px"><button id="fJson" class="on">JSON</button><button id="fCss">CSS</button></div>
      <textarea id="tOut" readonly></textarea><button class="ghost" id="tCopy" style="width:100%;margin-top:6px">Copy</button></div>
    <div id="tImportPane" class="hidden"><label>Paste tokens JSON</label><textarea id="tIn"></textarea><button class="go" id="tImportGo">Apply to styles</button></div>
    <div class="status" id="tStatus"></div>
  </div>

  <!-- CONTENT -->
  <div id="content" class="hidden">
    <button class="back" data-home>‹ Home</button><label>Fill selected text</label>
    <div class="pills" id="cPills">
      <span class="pill on" data-m="auto">Auto</span><span class="pill" data-m="fullName">Name</span><span class="pill" data-m="email">Email</span><span class="pill" data-m="price">Price</span><span class="pill" data-m="date">Date</span><span class="pill" data-m="city">City</span><span class="pill" data-m="company">Company</span><span class="pill" data-m="rating">Rating</span><span class="pill" data-m="paragraph">Paragraph</span>
    </div>
    <button class="go" id="cGo">Fill</button><button class="ghost" id="cShuffle" style="width:100%;margin-top:6px">Reshuffle</button><div class="status" id="cStatus"></div>
  </div>

  <!-- HTML -->
  <div id="html" class="hidden">
    <button class="back" data-home>‹ Home</button>
    <div class="tabs"><button id="hHtml" class="on">Paste HTML</button><button id="hUrl">From URL</button></div>
    <div id="hHtmlPane"><label>HTML</label><textarea id="hHtmlIn" placeholder="Paste page HTML…"></textarea></div>
    <div id="hUrlPane" class="hidden"><label>URL</label><input type="text" id="hUrlIn" placeholder="https://sinhaankur.com"></div>
    <div class="crow"><label>Width</label><input type="text" id="hWidth" value="1056"></div>
    <button class="go" id="hGo">Import</button><div class="status" id="hStatus"></div>
  </div>

  <!-- DEV -->
  <div id="dev" class="hidden">
    <button class="back" data-home>‹ Home</button><label>Dev bundle (for VS Code / your repo)</label>
    <div class="crow"><label>CSS prefix</label><input type="text" id="dPrefix" placeholder="kelo (optional)"></div>
    <button class="go" id="dGo">Build dev bundle</button>
    <label style="margin-top:10px">Result</label><textarea id="dOut" readonly placeholder="tokens.css + tokens.json + components manifest…"></textarea>
    <div class="crow" style="margin-top:6px"><button class="ghost" id="dCopy" style="flex:1">Copy</button><button class="ghost" id="dDownload" style="flex:1">Download bundle</button></div>
    <div class="status" id="dStatus"></div>
  </div>
</div>
<iframe id="stage" sandbox="allow-same-origin"></iframe>
<script>"use strict";
(() => {
  // src/cores/css-core.ts
  function parseColor(css) {
    if (!css) return null;
    const s = css.trim().toLowerCase();
    if (s === "transparent" || s === "none") return null;
    let m = s.match(/^rgba?\(([^)]+)\)$/);
    if (m) {
      const parts = m[1].split(/[,\/\s]+/).filter(Boolean);
      const r = num(parts[0]) / 255, g = num(parts[1]) / 255, b = num(parts[2]) / 255;
      const a = parts[3] != null ? clamp01(num(parts[3])) : 1;
      if (a === 0) return null;
      return { r: clamp01(r), g: clamp01(g), b: clamp01(b), a };
    }
    m = s.match(/^#([0-9a-f]{3,8})$/);
    if (m) {
      const h = m[1];
      const to = (i, len) => parseInt(len === 1 ? h[i] + h[i] : h.slice(i, i + 2), 16) / 255;
      if (h.length === 3) return { r: to(0, 1), g: to(1, 1), b: to(2, 1), a: 1 };
      if (h.length === 6) return { r: to(0, 2), g: to(2, 2), b: to(4, 2), a: 1 };
      if (h.length === 8) {
        const a = to(6, 2);
        return a === 0 ? null : { r: to(0, 2), g: to(2, 2), b: to(4, 2), a };
      }
    }
    return null;
  }
  function num(s) {
    const n = parseFloat(s);
    return Number.isFinite(n) ? n : 0;
  }
  function clamp01(n) {
    return Math.max(0, Math.min(1, n));
  }
  function px(v) {
    return num(String(v).replace("px", ""));
  }
  function parseRadius(css) {
    const first = px((css || "0").split(/\s+/)[0]);
    return Math.max(0, first);
  }
  function fontStyleName(weight, italic) {
    const w = parseInt(weight, 10) || 400;
    const base = w >= 800 ? "Black" : w >= 700 ? "Bold" : w >= 600 ? "SemiBold" : w >= 500 ? "Medium" : w <= 300 ? "Light" : "Regular";
    if (italic) return base === "Regular" ? "Italic" : `${base} Italic`;
    return base;
  }
  function textAlign(css) {
    switch ((css || "").toLowerCase()) {
      case "center":
        return "CENTER";
      case "right":
      case "end":
        return "RIGHT";
      case "justify":
        return "JUSTIFIED";
      default:
        return "LEFT";
    }
  }
  function parseBoxShadow(css) {
    if (!css || css === "none") return null;
    const color = parseColor(css) || { r: 0, g: 0, b: 0, a: 0.25 };
    const nums = css.match(/-?[\d.]+px/g);
    if (!nums || nums.length < 2) return null;
    const v = nums.map((n) => parseFloat(n));
    return { x: v[0], y: v[1], blur: v[2] || 0, spread: v[3] || 0, color };
  }
  function isRenderable(style) {
    if (style.display === "none" || style.visibility === "hidden") return false;
    if (parseFloat(style.opacity) === 0) return false;
    if (style.width <= 0 || style.height <= 0) return false;
    return true;
  }
  function hasVisibleBox(bg, border, radius) {
    return !!bg || !!border || radius > 0;
  }

  // src/ui.ts
  var el = (id) => document.getElementById(id);
  var PANELS = ["home", "kit", "audit", "library", "tokens", "content", "html", "dev"];
  function show(id) {
    for (const p of PANELS) el(p).classList.toggle("hidden", p !== id);
  }
  document.querySelectorAll("[data-go]").forEach((t) => t.addEventListener("click", () => show(t.dataset.go)));
  document.querySelectorAll("[data-home]").forEach((b) => b.addEventListener("click", () => show("home")));
  var post = (m) => parent.postMessage({ pluginMessage: m }, "*");
  el("kGo").addEventListener("click", () => {
    el("kStatus").textContent = "Building\u2026";
    post({ type: "create-kit", theme: {
      accent: el("kAccent").value,
      fg: el("kFg").value,
      bg: el("kBg").value,
      muted: el("kMuted").value,
      fontFamily: el("kFont").value || "Inter",
      radius: parseInt(el("kRadius").value) || 10
    } });
  });
  var aScope = "page";
  el("aPage").addEventListener("click", () => {
    aScope = "page";
    el("aPage").classList.add("on");
    el("aSel").classList.remove("on");
  });
  el("aSel").addEventListener("click", () => {
    aScope = "selection";
    el("aSel").classList.add("on");
    el("aPage").classList.remove("on");
  });
  el("aGo").addEventListener("click", () => {
    el("aOut").innerHTML = `<div class="status">Scanning\u2026</div>`;
    post({ type: "audit", scope: aScope, opts: {} });
  });
  el("lGo").addEventListener("click", () => {
    el("lOut").innerHTML = `<div class="status">Scanning\u2026</div>`;
    post({ type: "audit-library" });
  });
  var tFmt = "json";
  var tJson = "";
  var tCss = "";
  el("tExport").addEventListener("click", () => {
    el("tExport").classList.add("on");
    el("tImport").classList.remove("on");
    el("tExportPane").classList.remove("hidden");
    el("tImportPane").classList.add("hidden");
  });
  el("tImport").addEventListener("click", () => {
    el("tImport").classList.add("on");
    el("tExport").classList.remove("on");
    el("tImportPane").classList.remove("hidden");
    el("tExportPane").classList.add("hidden");
  });
  el("fJson").addEventListener("click", () => {
    tFmt = "json";
    el("fJson").classList.add("on");
    el("fCss").classList.remove("on");
    el("tOut").value = tJson;
  });
  el("fCss").addEventListener("click", () => {
    tFmt = "css";
    el("fCss").classList.add("on");
    el("fJson").classList.remove("on");
    el("tOut").value = tCss;
  });
  el("tGo").addEventListener("click", () => {
    el("tStatus").textContent = "Reading\u2026";
    post({ type: "tokens-export", prefix: el("tPrefix").value.trim() });
  });
  el("tImportGo").addEventListener("click", () => post({ type: "tokens-import", json: el("tIn").value.trim() }));
  el("tCopy").addEventListener("click", () => copy(el("tOut").value, "tStatus"));
  var cMode = "auto";
  var cSeed = rnd();
  el("cPills").querySelectorAll(".pill").forEach((p) => p.addEventListener("click", () => {
    el("cPills").querySelectorAll(".pill").forEach((x) => x.classList.remove("on"));
    p.classList.add("on");
    cMode = p.dataset.m;
  }));
  el("cGo").addEventListener("click", () => {
    cSeed = rnd();
    el("cStatus").textContent = "Filling\u2026";
    post({ type: "fill", mode: cMode, seed: cSeed });
  });
  el("cShuffle").addEventListener("click", () => {
    cSeed = rnd();
    post({ type: "fill", mode: cMode, seed: cSeed });
  });
  var hMode = "html";
  el("hHtml").addEventListener("click", () => {
    hMode = "html";
    el("hHtml").classList.add("on");
    el("hUrl").classList.remove("on");
    el("hHtmlPane").classList.remove("hidden");
    el("hUrlPane").classList.add("hidden");
  });
  el("hUrl").addEventListener("click", () => {
    hMode = "url";
    el("hUrl").classList.add("on");
    el("hHtml").classList.remove("on");
    el("hUrlPane").classList.remove("hidden");
    el("hHtmlPane").classList.add("hidden");
  });
  el("hGo").addEventListener("click", runHtml);
  async function runHtml() {
    let html = "";
    if (hMode === "html") {
      html = el("hHtmlIn").value.trim();
      if (!html) {
        el("hStatus").textContent = "Paste HTML first.";
        return;
      }
    } else {
      const u = el("hUrlIn").value.trim();
      if (!u) {
        el("hStatus").textContent = "Enter a URL.";
        return;
      }
      el("hStatus").textContent = "Fetching\u2026";
      try {
        const r = await fetch(u, { mode: "cors" });
        html = absolutize(await r.text(), u);
      } catch {
        el("hStatus").textContent = "Fetch blocked \u2014 paste HTML instead.";
        return;
      }
    }
    el("hStatus").textContent = "Rendering\u2026";
    const width = px(el("hWidth").value || "1056") || 1056;
    const stage = el("stage");
    stage.style.width = width + "px";
    const doc = stage.contentDocument;
    doc.open();
    doc.write(html);
    doc.close();
    await new Promise((r) => setTimeout(r, 350));
    try {
      await doc.fonts?.ready;
    } catch {
    }
    const body = doc.body;
    const tree = { kind: "frame", name: "Imported page", x: 0, y: 0, w: width, h: Math.max(body.scrollHeight, 1), fill: parseColor(getComputedStyle(body).backgroundColor) || { r: 1, g: 1, b: 1, a: 1 }, children: [] };
    const out = [];
    await walk(body, doc, out);
    tree.children = out;
    el("hStatus").textContent = "Building\u2026";
    post({ type: "html-import", tree });
  }
  function absolutize(html, base) {
    try {
      const b = new URL(base);
      return html.replace(/(src|href)=["'](?!https?:|data:|#)([^"']+)["']/gi, (_m, a, p) => `${a}="${new URL(p, b).href}"`);
    } catch {
      return html;
    }
  }
  async function walk(node, doc, out) {
    for (const child of Array.from(node.children)) {
      const s = getComputedStyle(child);
      const rect = child.getBoundingClientRect();
      const win = doc.defaultView;
      const x = rect.left + win.scrollX, y = rect.top + win.scrollY, w = rect.width, h = rect.height;
      if (!isRenderable({ display: s.display, visibility: s.visibility, opacity: s.opacity, width: w, height: h })) continue;
      const bg = parseColor(s.backgroundColor), border = parseColor(s.borderTopColor), bw = px(s.borderTopWidth), radius = parseRadius(s.borderTopLeftRadius);
      const shadow = parseBoxShadow(s.boxShadow);
      const tag = child.tagName.toLowerCase();
      if (tag === "img") {
        const bytes = await imageBytes(child, w, h);
        if (bytes) {
          out.push({ kind: "image", name: "img", x, y, w, h, radius, imageBytes: bytes });
          continue;
        }
      }
      if (hasVisibleBox(bg, bw > 0 ? border : null, radius) || shadow) out.push({ kind: "rect", name: tag, x, y, w, h, fill: bg, stroke: bw > 0 ? border : null, strokeWidth: bw, radius, opacity: parseFloat(s.opacity), shadow });
      const txt = directText(child);
      if (txt) out.push({ kind: "text", name: txt.slice(0, 40), x, y, w, h, text: txt, fontSize: px(s.fontSize) || 16, fontFamily: (s.fontFamily.split(",")[0] || "Inter").replace(/["']/g, "").trim(), fontStyle: fontStyleName(s.fontWeight, s.fontStyle === "italic"), color: parseColor(s.color), align: textAlign(s.textAlign) });
      await walk(child, doc, out);
    }
  }
  async function imageBytes(img, w, h) {
    try {
      if (!img.complete || !img.naturalWidth) return null;
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(w));
      c.height = Math.max(1, Math.round(h));
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise((res) => c.toBlob((b) => res(b), "image/png"));
      return Array.from(new Uint8Array(await blob.arrayBuffer()));
    } catch {
      return null;
    }
  }
  function directText(e) {
    let s = "";
    for (const n of Array.from(e.childNodes)) if (n.nodeType === 3) s += n.textContent || "";
    return s.replace(/\s+/g, " ").trim();
  }
  var devBundle = null;
  el("dGo").addEventListener("click", () => {
    el("dStatus").textContent = "Building\u2026";
    post({ type: "dev-export", prefix: el("dPrefix").value.trim() });
  });
  el("dCopy").addEventListener("click", () => copy(el("dOut").value, "dStatus"));
  el("dDownload").addEventListener("click", () => {
    if (!devBundle) return;
    download("tokens.json", devBundle.tokensJson, "application/json");
    download("tokens.css", devBundle.tokensCss, "text/css");
    download("components.json", JSON.stringify(devBundle.components, null, 2), "application/json");
    el("dStatus").textContent = "Downloaded tokens.json + tokens.css + components.json \u2713";
  });
  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    switch (m.type) {
      case "error":
        setStatusAll(m.message);
        break;
      case "kit-done":
        el("kStatus").textContent = `Created ${m.components} components + styles \u2713`;
        break;
      case "audit-result":
        renderAudit(m);
        break;
      case "library-result":
        renderLibrary(m);
        break;
      case "tokens-result":
        tJson = m.json;
        tCss = m.css;
        el("tOut").value = tFmt === "json" ? tJson : tCss;
        el("tStatus").textContent = `${m.counts.colors} colors \xB7 ${m.counts.text} text \u2713`;
        break;
      case "tokens-imported":
        el("tStatus").textContent = `Applied \u2014 ${m.created} created, ${m.updated} updated \u2713`;
        break;
      case "filled":
        el("cStatus").textContent = `Filled ${m.n} layers \u2713`;
        break;
      case "html-done":
        el("hStatus").textContent = `Imported ${m.count} layers \u2713`;
        break;
      case "dev-bundle":
        devBundle = m;
        el("dOut").value = `/* tokens.css */
${m.tokensCss}

/* ${m.components.length} components */
${m.components.join("\n")}`;
        el("dStatus").textContent = "Bundle ready \u2014 Copy or Download \u2713";
        break;
    }
  };
  function renderAudit(m) {
    const f = m.findings;
    if (!f.length) {
      el("aOut").innerHTML = `<div class="status" style="color:var(--ok)">\u2713 Clean across ${m.scanned} layers</div>`;
      return;
    }
    const order = { error: 0, warn: 1, info: 2 };
    f.sort((a, b) => order[a.severity] - order[b.severity]);
    el("aOut").innerHTML = `<div class="summary"><div class="stat e"><b>${m.summary.errors}</b><span>Errors</span></div><div class="stat w"><b>${m.summary.warnings}</b><span>Warn</span></div><div class="stat i"><b>${m.summary.info}</b><span>Info</span></div></div><div class="list">${f.map((x) => `<div class="item" data-id="${x.id}"><span class="dot ${x.severity}"></span><div><div class="n">${esc(x.name)}</div><div class="m">${esc(x.message)}</div></div></div>`).join("")}</div>`;
    el("aOut").querySelectorAll(".item").forEach((r) => r.addEventListener("click", () => post({ type: "select", id: r.dataset.id })));
  }
  function renderLibrary(m) {
    const i = m.issues;
    const s = m.summary;
    const head = `<div class="summary"><div class="stat"><b>${s.score}</b><span>Health</span></div><div class="stat"><b>${s.components}</b><span>Comps</span></div><div class="stat e"><b>${s.errors + s.warnings}</b><span>Issues</span></div></div>`;
    if (!i.length) {
      el("lOut").innerHTML = head + `<div class="status" style="color:var(--ok)">\u2713 Library looks clean</div>`;
      return;
    }
    el("lOut").innerHTML = head + `<div class="list">${i.map((x) => `<div class="item" data-id="${x.id}"><span class="dot ${x.severity}"></span><div><div class="n">${esc(x.name)}</div><div class="m">${esc(x.message)}${x.suggestion ? " \u2192 " + esc(x.suggestion) : ""}</div></div></div>`).join("")}</div>`;
    el("lOut").querySelectorAll(".item").forEach((r) => r.addEventListener("click", () => post({ type: "select", id: r.dataset.id })));
  }
  function copy(txt, statusId) {
    navigator.clipboard.writeText(txt).then(() => el(statusId).textContent = "Copied \u2713").catch(() => {
    });
  }
  function download(name, txt, type) {
    const b = new Blob([txt], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function esc(s) {
    return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  }
  function rnd() {
    return Math.floor(Math.random() * 1e6);
  }
  function setStatusAll(msg) {
    ["kStatus", "tStatus", "cStatus", "hStatus", "dStatus"].forEach((id) => {
      const e = document.getElementById(id);
      if (e) e.textContent = msg;
    });
  }
})();
</script>
</body></html>
